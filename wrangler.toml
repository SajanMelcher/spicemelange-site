# Cloudflare Pages config. PRODUCTION IS LIVE ON SUI MAINNET (Sajan, 10/9/2026 6:26 AM PT). Preview stays on testnet.
# Secrets (set per env with `wrangler pages secret put ...` [--env preview], NEVER committed):
#   DOWNLOAD_HMAC_SECRET (>= 32 chars), STORE_PAYTO (receive-only Sui address),
#   STORE_SELFTEST_KEY (production; unlocks the hidden `selftest` SKU), optional HWI_WEBHOOK_URL + HWI_WEBHOOK_SECRET.
# Mainnet needs SUI_NETWORK="mainnet" AND STORE_ALLOW_MAINNET="1" (Sajan's explicit OK only).
name = "spicemelange-site"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-01"

[vars]
# Wallet-signing pages /certificates/prove-wallet/ + /certificates/admin/ on thespicemelange.org: OFF until Siona passes them
# (build strips them, API answers preview_only). Mainnet only when ON.
WALLET_PAGES_LIVE = "0"
STORE_ENABLED = "1"
SUI_NETWORK = "mainnet"
STORE_ALLOW_MAINNET = "1"
# Signal feed LIVE (Sajan 2026-10-10 12:08 AM PT, starter rules: 5 ideas/order/day, points only by grant, non-cashable).
# SIGNALS_ADMIN_KEY is a production Pages secret (separate from preview); a copy is kept outside the repo.
SIGNALS_ENABLED = "1"
# Hwi's 14-day practice lessons (Sajan's yes 2026-10-10 7:16 AM PT; double opt-in only). Same flag as
# workers/hwi-lessons/wrangler.toml [vars] (signup here, sending there). ON 2026-10-10 after the production
# end-to-end check (signup, confirm email, confirm, Day 1, one-click unsubscribe link + POST, footer). Lesson runs hold in
# the worker until /privacy/ is live and /terms/ has the Resend opt-in line.
LESSONS_PRODUCTION_SENDING = "1"
# Free Golden Path course signup on /learn/ (R6): OFF in production until Siona + Sajan approve.
COURSE_PRODUCTION_SENDING = "1" # ON 2026-10-10 (Sajan 9:31 AM PT "Live"; Siona passed 7007a7d + run10; gate open)
# ONE store switch (Siona SJ1), read at BUILD time (deploy.sh exports this exact value; scripts/wrangler-var.mjs) and at ORDER
# time (createOrder). "1" = the seven $50 single seats are on sale; "0" = The Secret Journals only (matches LICENSE 2026.10.10.1 §1).
# PENDING SAJAN'S CONFIRMATION of singles off: to flip production, change this ONE line to "0" and redeploy.
# PREPARED (separate commit, drop it if Sajan says no): production sells only The Secret Journals; /terms/ = LICENSE 2026.10.10.1.
STORE_SINGLES_FOR_SALE = "0"
# Spice Certificates LAUNCH flag (Siona SJ2): "0" = /certificates/*, the home card, nav link, wallet sign-in, footer option A and
# the /privacy/ certificates section are not built, and /api/certificates/* + legacy holder links return 404.
# ON: Sajan 9:59 PM PT 10/10 ("Approve it anyway and go live").
SPICE_CERTS_LIVE = "1"
# ONE network switch for the certificate contract (buy page, holder ownership reads, redemption request), store-core/spice-cert-net.js.
# "mainnet" = the v6 ids synced from spice-certificates/deploy.mainnet.json into store-core/spice-cert-testnet.json.
SPICE_CERT_REDEEM_NETWORK = "mainnet"
# Mainnet buying also needs the Issuer unpaused on-chain (read live). "0" keeps the buy page on "Sales are paused" even after an
# on-chain unpause. "1" (Sajan "go live", 10:07 PM PT 10/10): the buy button opens as soon as the Issuer is unpaused on-chain.
SPICE_CERT_MAINNET_SALES = "1"
# Holder statements + withdraw flow on production: D1 records (migrations/0012) fed box-side by scripts/spice-holder-sync.mjs
# (Hwi's ledger block + holders.private; watcher minimal rows). On-chain ownership is re-read on every request.
SPICE_HOLDERS_LIVE = "1"
SPICE_HOLDER_SOURCE = "d1"
# Home "No leverage" card (Siona SJ21): "1" = Sajan's 9:19 PM PT wording ("No leverage, no borrowed money" / "The Spice Melange
# trading desk trades on Sui with no leverage and no borrowed money."); "0" = the older card. Build time only.
HOME_FUNDS_LINE_LIVE = "1"

[[kv_namespaces]]
binding = "STORE_KV"
id = "8ce50b93050349ca9141a9759fddc50a" # spicemelange-store-prod (outbox, rate limit)

[[kv_namespaces]]
binding = "STORE_FILES"
id = "78f18195d1fe4263ab84e9d8ecb7de92" # spicemelange-store-files-prod (private product zips)

[[d1_databases]]
binding = "STORE_DB"
database_name = "spicemelange-store-prod"
database_id = "cfe878af-064f-4e0d-81d3-aa08b19e2ceb" # orders, amount_holds, redemptions (migrations/0001_store.sql)

[env.preview.vars]
WALLET_PAGES_LIVE = "1"
SPICE_HOLDER_SOURCE = "d1+sample"
SPICE_CERT_REDEEM_NETWORK = "testnet"
STORE_ENABLED = "1"
SUI_NETWORK = "testnet"
# Spice Certificates holder data: TESTNET PREVIEW only. SPICE_CERT_PREVIEW gates the holder API (statements, withdrawals,
# trade); sign-in, the license check and the testnet buy preview need SPICE_CERTS_LIVE + SPICE_SESSION_SECRET + STORE_DB.
# Preview secrets: SPICE_SESSION_SECRET (>=32 chars), SPICE_HOLDERS_PRIVATE (FAKE holders).
SPICE_CERT_PREVIEW = "1"
SPICE_CERTS_LIVE = "1"
HOME_FUNDS_LINE_LIVE = "1"
# Same one switch as [vars] (build + order time): the preview runs singles OFF.
STORE_SINGLES_FOR_SALE = "0"
# Testnet certificate ids: store-core/spice-cert-testnet.json (generated by scripts/sync-spice-cert-ids.mjs). The holder API
# defaults to its `holders.certificateType`; set SPICE_CERT_TYPE only to override.
# Signal feed on preview (testnet orders only).
# SIGNALS_ADMIN_KEY is a preview Pages secret; a copy is kept outside the repo.
SIGNALS_ENABLED = "1"
# Hwi's lessons + free course on preview (Siona GL7): signup ONLY for this test allowlist; everyone else is refused and
# nothing is stored. The preview sender Worker mails only its own (same) test lists.
LESSONS_PRODUCTION_SENDING = "0"
COURSE_PRODUCTION_SENDING = "0"
LESSONS_TEST_RECIPIENTS = "delivered@resend.dev"
COURSE_TEST_RECIPIENTS = "delivered@resend.dev,delivered+pilgrim@resend.dev,delivered+fremen@resend.dev,delivered+naib@resend.dev"

[[env.preview.kv_namespaces]]
binding = "STORE_KV"
id = "20d393d0a08440a7b391b7b64e9aea4c" # spicemelange-store-preview (orders, amounts, digests, outbox)

[[env.preview.kv_namespaces]]
binding = "STORE_FILES"
id = "12b066b74257488f913cf69f73c3b8d8" # spicemelange-store-files-preview (private product zips)

[[env.preview.d1_databases]]
binding = "STORE_DB"
database_name = "spicemelange-store-preview"
database_id = "c03d4c24-3cba-43a8-857d-5f8d3c5b7415" # orders, amount_holds, redemptions (migrations/0001_store.sql)
